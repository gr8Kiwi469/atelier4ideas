baseURL = "https://atelier4ideas.com/"
title = "Atelier4Ideas"
theme = "PaperMod"
paginate = 10
locale = "en-US"
canonifyURLs = true
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    direction = "ltr"
    weight = 1

[params]
  description = "Creative explorations, ideas, workflows, and visual thinking."
  keywords = ["ideas", "creativity", "workflows", "design", "exploration"]
  author = "Keith Denham"

  defaultTheme = "auto"
  disableThemeToggle = false
  showReadingTime = true
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  showToc = true
  search = true

  disableSchema = true

  [params.homeInfoParams]
    Title = "Atelier4Ideas"
    Content = """
A creative studio for explorations, workflows, and idea development.
Structured thinking meets visual experimentation.
"""

  [params.socialIcons]
    name = "github"
    url = "https://github.com/gr8Kiwi469"

  [params.assets]
    favicon = "/images/favicon.png"
    logo = "/images/logo.png"

[menu]
  [[menu.main]]
    name = "Ideas"
    url = "/ideas/"
    weight = 1

  [[menu.main]]
    name = "Workflows"
    url = "/workflows/"
    weight = 2

  [[menu.main]]
    name = "Explorations"
    url = "/explorations/"
    weight = 3

  [[menu.main]]
    name = "Collections"
    url = "/collections/"
    weight = 4

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 5

