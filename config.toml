baseURL = "https://atelier4ideas.com/"
title = "Atelier4Ideas"
theme = "PaperMod"
paginate = 10
locale = "en-US"

# Enable clean URLs
canonifyURLs = true

# Improve SEO + social previews
enableRobotsTXT = true

# Better Markdown rendering
enableEmoji = true

# Syntax highlighting
pygmentsUseClasses = true

[languages]
  [languages.en]
    languageName = "English"
    locale = "en-US"
    direction = "ltr"
    weight = 1

[params]
  # Core identity
  description = "Creative explorations, ideas, workflows, and visual thinking."
  keywords = ["ideas", "creativity", "workflows", "design", "exploration"]
  author = "Keith Denham"

  # UI / UX
  defaultTheme = "auto"       # auto-switch light/dark
  disableThemeToggle = false
  showReadingTime = true
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  showToc = true

  # Homepage
  homeInfoParams = { 
    Title = "Atelier4Ideas",
    Content = "Explorations, creative workflows, and idea development."
  }

  # Social icons (add/remove as needed)
  socialIcons = [
    { name = "github", url = "https://github.com/gr8Kiwi469" },
    { name = "email", url = "mailto:your-email@example.com" }
  ]

  # Search (client-side)
  fuseOpts = { 
    isCaseSensitive = false,
    shouldSort = true,
    includeMatches = true,
    threshold = 0.3
  }

# Menu structure (example — adjust as needed)
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "Ideas"
    url = "/ideas/"
    weight = 2

  [[menu.main]]
    name = "Workflows"
    url = "/workflows/"
    weight = 3

  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4

